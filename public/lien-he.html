<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liên hệ - Đánh máy 247</title>
  <meta name="description" content="Liên hệ Đánh máy 247 qua hotline, Zalo, email hoặc biểu mẫu trực tuyến. Hỗ trợ 24/7.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-header="grey">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Trang chủ</a><span>/</span><span aria-current="page">Liên hệ</span></nav>
        <h1>Liên hệ với chúng tôi</h1>
        <p>Đội ngũ hỗ trợ luôn sẵn sàng 24/7. Gửi câu hỏi, yêu cầu báo giá hoặc góp ý - chúng tôi sẽ phản hồi trong vòng 15 phút.</p>
      </div>
    </section>
    <section class="section">
      <div class="container contact-grid">
        <div><p class="chip chip--navy" style="font-size:13px;padding:6px 14px;margin-bottom:18px">Đánh máy 247 - Sản phẩm của VietSCI Editing Services</p><div class="contact-info" id="info"></div></div>
        <div class="order-card" style="margin:0">
          <h2 class="order-card__title">Gửi tin nhắn</h2>
          <form id="contact" novalidate>
            <div id="c-msg" aria-live="polite"></div>
            <div class="order-row">
              <div class="field"><label class="field__label" for="c-name">Họ và tên <span class="req">*</span></label><input class="input" id="c-name" name="name" required autocomplete="name"><div class="field__error"></div></div>
              <div class="field"><label class="field__label" for="c-email">Email <span class="req">*</span></label><input class="input" id="c-email" name="email" type="email" required autocomplete="email"><div class="field__error"></div></div>
            </div>
            <div class="order-row">
              <div class="field"><label class="field__label" for="c-phone">Số điện thoại</label><input class="input" id="c-phone" name="phone" type="tel" autocomplete="tel" data-pattern="^\+?[0-9 .\-]{8,15}$" data-pattern-msg="Số điện thoại không hợp lệ."><div class="field__error"></div></div>
              <div class="field"><label class="field__label" for="c-subject">Chủ đề</label>
                <select class="select" id="c-subject" name="subject"><option>Yêu cầu báo giá</option><option>Hỏi về đơn hàng</option><option>Hợp tác doanh nghiệp</option><option>Tuyển dụng chuyên viên</option><option>Góp ý dịch vụ</option><option>Khác</option></select>
              </div>
            </div>
            <div class="field"><label class="field__label" for="c-text">Nội dung <span class="req">*</span></label><textarea class="textarea" id="c-text" name="message" required minlength="10" maxlength="3000" placeholder="Mô tả ngắn gọn yêu cầu của bạn: loại tài liệu, số trang, thời hạn mong muốn…"></textarea><div class="field__error"></div></div>
            <div class="field"><label class="check"><input type="checkbox" name="agree" required data-msg="Vui lòng đồng ý để chúng tôi liên hệ lại."><span class="check__box"></span><span>Tôi đồng ý cho Đánh máy 247 sử dụng thông tin trên để liên hệ theo <a href="#" data-legal="privacy">Chính sách bảo mật</a></span></label><div class="field__error"></div></div>
            <button class="button" type="submit">Gửi tin nhắn</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
  (function () {
    var $ = DM.$, s = DM.site;
    var item = function (ic, title, html, sub) { return '<div class="contact-item"><div class="card__ic">' + DM.icon[ic] + "</div><div><b>" + title + "</b>" + html + (sub ? "<br><small>" + sub + "</small>" : "") + "</div></div>"; };
    $("#info").innerHTML =
      item("phone", "Hotline", '<a href="tel:' + s.phoneHref + '">' + s.phone + "</a>", "Miễn phí cuộc gọi, hỗ trợ 24/7") +
      item("chat", "Zalo", '<a href="https://zalo.me/' + s.zalo + '" target="_blank" rel="noopener">' + s.phone + "</a>", "Gửi ảnh tài liệu để báo giá nhanh") +
      item("mail", "Email", '<a href="mailto:' + s.email + '">' + s.email + "</a>", "Phản hồi trong 15 phút giờ hành chính") +
      (s.address ? item("pin", "Văn phòng", "<span>" + s.address + "</span>", "Thứ Hai – Thứ Bảy, 8:00 – 18:00") : "") +
      '<button type="button" class="button button--black button--w100" id="open-chat">Chat trực tuyến ngay</button>';
    $("#open-chat").addEventListener("click", DM.openChat);

    var fill = function (u) { if (u) { $("#c-name").value = $("#c-name").value || u.name; $("#c-email").value = $("#c-email").value || u.email; $("#c-phone").value = $("#c-phone").value || u.phone || ""; } };
    DM.authReady.then(fill);
    var subj = DM.param("subject"); if (subj) $("#c-subject").value = subj;

    $("#contact").addEventListener("submit", function (e) {
      e.preventDefault();
      var form = this;
      if (!DM.validate(form)) return;
      var d = Object.fromEntries(new FormData(form));
      var btn = $("button[type=submit]", form);
      btn.disabled = true; btn.textContent = "Đang gửi…";
      DM.api("/contact", { body: { name: d.name, email: d.email, phone: d.phone, subject: d.subject, message: d.message } }).then(function () {
        $("#c-msg").innerHTML = '<div class="alert alert--success"><b>Đã gửi thành công!</b> Cảm ơn ' + DM.esc(d.name.trim()) + ", chúng tôi sẽ liên hệ lại qua " + DM.esc(d.email.trim()) + " trong thời gian sớm nhất.</div>";
        form.reset(); fill(DM.me);
      }, function (er) {
        $("#c-msg").innerHTML = '<div class="alert alert--error">' + DM.esc(er.message) + "</div>";
      }).then(function () {
        btn.disabled = false; btn.textContent = "Gửi tin nhắn";
        $("#c-msg").scrollIntoView({ behavior: "smooth", block: "center" });
      });
    });
  })();
  </script>
</body>
</html>
