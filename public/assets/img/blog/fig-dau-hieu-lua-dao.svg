<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" font-family="'Open Sans','Segoe UI',Arial,sans-serif"><rect width="960" height="470" rx="18" fill="#f6f7fb"/><rect x="30" y="30" width="440" height="180" rx="16" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><rect x="30" y="30" width="10" height="180" rx="5" fill="#f24d50"/><circle cx="110" cy="120" r="46" fill="#f24d50"/><text x="110" y="138" text-anchor="middle" font-size="48" font-weight="800" fill="#fff">₫</text><text x="180" y="100" font-size="23" font-weight="800" fill="#1d2040">Đòi tiền trước</text><text x="180" y="136" font-size="16.5" fill="#55586b">Phí đăng ký, phí tài liệu,</text><text x="180" y="160" font-size="16.5" fill="#55586b">đặt cọc, “bảo hiểm hồ sơ”</text><rect x="490" y="30" width="440" height="180" rx="16" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><rect x="490" y="30" width="10" height="180" rx="5" fill="#f3a33b"/><circle cx="570" cy="120" r="46" fill="#f3a33b"/><text x="570" y="138" text-anchor="middle" font-size="48" font-weight="800" fill="#fff">%</text><text x="640" y="100" font-size="23" font-weight="800" fill="#1d2040">Thu nhập phi lý</text><text x="640" y="136" font-size="16.5" fill="#55586b">Vài giờ gõ đơn giản mà hứa</text><text x="640" y="160" font-size="16.5" fill="#55586b">hàng trăm nghìn mỗi ngày</text><rect x="30" y="230" width="440" height="180" rx="16" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><rect x="30" y="230" width="10" height="180" rx="5" fill="#9b51e0"/><circle cx="110" cy="320" r="46" fill="#9b51e0"/><text x="110" y="338" text-anchor="middle" font-size="48" font-weight="800" fill="#fff">↻</text><text x="180" y="300" font-size="23" font-weight="800" fill="#1d2040">Nạp tiền nhận hoa hồng</text><text x="180" y="336" font-size="16.5" fill="#55586b">Trả nhỏ để tạo lòng tin, rồi</text><text x="180" y="360" font-size="16.5" fill="#55586b">đòi nạp lớn “mở khóa nhiệm vụ”</text><rect x="490" y="230" width="440" height="180" rx="16" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><rect x="490" y="230" width="10" height="180" rx="5" fill="#2d3078"/><circle cx="570" cy="320" r="46" fill="#2d3078"/><text x="570" y="338" text-anchor="middle" font-size="48" font-weight="800" fill="#fff">!</text><text x="640" y="300" font-size="23" font-weight="800" fill="#1d2040">Xin thông tin nhạy cảm</text><text x="640" y="336" font-size="16.5" fill="#55586b">Mã OTP, mật khẩu, ảnh căn</text><text x="640" y="360" font-size="16.5" fill="#55586b">cước kèm khuôn mặt</text><text x="480" y="452" text-anchor="middle" font-size="14" fill="#7f8491">Gặp bất kỳ dấu hiệu nào: dừng lại, không chuyển tiền, không cung cấp thông tin</text></svg>