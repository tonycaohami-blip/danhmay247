<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" font-family="'Open Sans','Segoe UI',Arial,sans-serif"><rect width="960" height="360" rx="18" fill="#f6f7fb"/><text x="60" y="50" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="800" font-size="17" fill="#1d2040">Tổng chi phí thật = giá niêm yết + chi phí phát sinh (ví dụ minh họa)</text><text x="60" y="132" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="800" font-size="18" fill="#1d2040">Dịch vụ “siêu rẻ”</text><rect x="260" y="100" width="220" height="48" fill="#2d3078"/><text x="370" y="130" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="13.5" fill="#fff">Giá niêm yết</text><rect x="480" y="100" width="137.5" height="48" fill="#f3a33b"/><text x="548.75" y="130" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="13.5" fill="#fff">Phí phát sinh</text><rect x="617.5" y="100" width="220" height="48" fill="#f24d50"/><text x="727.5" y="130" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="13.5" fill="#fff">Thời gian bạn sửa lỗi</text><text x="60" y="242" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="800" font-size="18" fill="#1d2040">Dịch vụ minh bạch</text><rect x="260" y="210" width="330" height="48" fill="#2d3078"/><text x="425" y="240" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="13.5" fill="#fff">Giá niêm yết</text><rect x="590" y="210" width="55" height="48" fill="#3bb54a"/><text x="260" y="286" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="400" font-size="13" fill="#7f8491">Giá niêm yết · Kiểm tra nhanh</text><text x="480" y="340" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="400" font-size="13.5" fill="#7f8491">So sánh trên cùng điều kiện: cách đếm trang, thời hạn, khâu kiểm tra, chỉnh sửa miễn phí</text></svg>