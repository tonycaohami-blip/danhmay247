<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" role="img" font-family="'Open Sans','Segoe UI',Arial,sans-serif"><rect width="960" height="380" rx="18" fill="#f6f7fb"/><rect x="60" y="40" width="380" height="300" rx="14" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><text x="210" y="140" text-anchor="end" font-family="'Times New Roman',Times,'Noto Serif',serif" font-weight="700" font-size="54" font-style="italic" fill="#f24d50">A</text><text x="210" y="300" text-anchor="end" font-family="'Times New Roman',Times,'Noto Serif',serif" font-weight="700" font-size="54" font-style="italic" fill="#2b579a">Z</text><text x="300" y="270" text-anchor="middle" font-family="'Times New Roman',Times,'Noto Serif',serif" font-weight="400" font-size="150" fill="#1d2040">X</text><path d="M470 120 H530" stroke="#f24d50" stroke-width="3"/><text x="545" y="115" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="20" fill="#f24d50">Số khối A = số proton + số neutron</text><path d="M470 280 H530" stroke="#2b579a" stroke-width="3"/><text x="545" y="285" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="20" fill="#2b579a">Nguyên tử số Z = số proton</text><text x="545" y="200" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="20" fill="#1d2040">X: ký hiệu nguyên tố, viết đứng</text><text x="480" y="365" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="400" font-size="14" fill="#7f8491">Ví dụ: uranium 235 có A = 235, Z = 92; hạt alpha có A = 4, Z = 2</text></svg>