<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" font-family="'Open Sans','Segoe UI',Arial,sans-serif"><rect width="960" height="330" rx="18" fill="#f6f7fb"/><circle cx="96" cy="110" r="46" fill="#f24d50"/><text x="96" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">1</text><text x="96" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Đánh máy</text><text x="96" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Bản viết tay,</text><text x="96" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">tệp rời → Word</text><path d="M148 110 H232" stroke="#c9cbd8" stroke-width="4" stroke-dasharray="8 7"/><path d="M222 100 L234 110 L222 120" fill="none" stroke="#c9cbd8" stroke-width="4"/><circle cx="288" cy="110" r="46" fill="#f3a33b"/><text x="288" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">2</text><text x="288" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Biên tập</text><text x="288" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Cấu trúc, mạch,</text><text x="288" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">tên riêng</text><path d="M340 110 H424" stroke="#c9cbd8" stroke-width="4" stroke-dasharray="8 7"/><path d="M414 100 L426 110 L414 120" fill="none" stroke="#c9cbd8" stroke-width="4"/><circle cx="480" cy="110" r="46" fill="#2b579a"/><text x="480" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">3</text><text x="480" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Hiệu đính</text><text x="480" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Chính tả,</text><text x="480" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">văn phong</text><path d="M532 110 H616" stroke="#c9cbd8" stroke-width="4" stroke-dasharray="8 7"/><path d="M606 100 L618 110 L606 120" fill="none" stroke="#c9cbd8" stroke-width="4"/><circle cx="672" cy="110" r="46" fill="#6a3fb5"/><text x="672" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">4</text><text x="672" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Dàn trang</text><text x="672" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Khổ sách, lề,</text><text x="672" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">phông, ảnh</text><path d="M724 110 H808" stroke="#c9cbd8" stroke-width="4" stroke-dasharray="8 7"/><path d="M798 100 L810 110 L798 120" fill="none" stroke="#c9cbd8" stroke-width="4"/><circle cx="864" cy="110" r="46" fill="#3bb54a"/><text x="864" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">5</text><text x="864" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Đọc bông</text><text x="864" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Sửa lỗi cuối</text><text x="864" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">trước khi in</text><text x="480" y="305" text-anchor="middle" font-size="14" fill="#7f8491">Chốt nội dung ở bước biên tập - sửa lớn khi đã dàn trang sẽ làm xô lệch toàn bộ số trang</text></svg>