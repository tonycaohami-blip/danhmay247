<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" font-family="'Open Sans','Segoe UI',Arial,sans-serif"><rect width="960" height="360" rx="18" fill="#f6f7fb"/><text x="60" y="50" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="800" font-size="18" fill="#1d2040">Thời gian bạn phải bỏ ra cho 50 trang (ví dụ minh họa)</text><text x="60" y="132" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="800" font-size="20" fill="#1d2040">Tự gõ</text><rect x="180" y="100" width="360" height="48" fill="#2d3078"/><text x="360" y="130" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="14" fill="#fff">Gõ chữ</text><rect x="540" y="100" width="120" height="48" fill="#2b579a"/><text x="600" y="130" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="14" fill="#fff">Bảng, định dạng</text><rect x="660" y="100" width="100" height="48" fill="#f3a33b"/><text x="710" y="130" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="14" fill="#fff">Soát lỗi</text><text x="774" y="132" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="800" font-size="20" fill="#f24d50">≈ 14,5 giờ</text><text x="60" y="242" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="800" font-size="20" fill="#1d2040">Thuê gõ</text><rect x="180" y="210" width="20" height="48" fill="#2d3078"/><rect x="200" y="210" width="40" height="48" fill="#3bb54a"/><text x="254" y="242" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="800" font-size="20" fill="#3bb54a">≈ 1,5 giờ</text><text x="180" y="286" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="400" font-size="13" fill="#7f8491">Chuẩn bị, gửi · Kiểm tra file</text><text x="480" y="340" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="400" font-size="13" fill="#7f8491">Giả định ~15-20 phút/trang khi tự gõ cả định dạng và soát lỗi; hãy tự đo bằng cách gõ thử 2-3 trang</text></svg>