<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" font-family="'Open Sans','Segoe UI',Arial,sans-serif"><rect width="960" height="330" rx="18" fill="#f6f7fb"/><circle cx="96" cy="110" r="46" fill="#8c877d"/><text x="96" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">1</text><text x="96" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Bản gốc sạch</text><text x="96" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Đánh máy, không</text><text x="96" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">ngắt dòng cứng</text><path d="M148 110 H232" stroke="#c9cbd8" stroke-width="4" stroke-dasharray="8 7"/><path d="M222 100 L234 110 L222 120" fill="none" stroke="#c9cbd8" stroke-width="4"/><circle cx="288" cy="110" r="46" fill="#5a3fd0"/><text x="288" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">2</text><text x="288" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Dịch máy</text><text x="288" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Tạo bản nháp</text><text x="288" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">nhanh</text><path d="M340 110 H424" stroke="#c9cbd8" stroke-width="4" stroke-dasharray="8 7"/><path d="M414 100 L426 110 L414 120" fill="none" stroke="#c9cbd8" stroke-width="4"/><circle cx="480" cy="110" r="46" fill="#f24d50"/><text x="480" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">3</text><text x="480" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Hậu biên tập</text><text x="480" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Sửa nghĩa, bỏ sót,</text><text x="480" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">văn phong</text><path d="M532 110 H616" stroke="#c9cbd8" stroke-width="4" stroke-dasharray="8 7"/><path d="M606 100 L618 110 L606 120" fill="none" stroke="#c9cbd8" stroke-width="4"/><circle cx="672" cy="110" r="46" fill="#f3a33b"/><text x="672" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">4</text><text x="672" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Kiểm tra</text><text x="672" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Thuật ngữ, số liệu,</text><text x="672" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">tên riêng</text><path d="M724 110 H808" stroke="#c9cbd8" stroke-width="4" stroke-dasharray="8 7"/><path d="M798 100 L810 110 L798 120" fill="none" stroke="#c9cbd8" stroke-width="4"/><circle cx="864" cy="110" r="46" fill="#3bb54a"/><text x="864" y="127" text-anchor="middle" font-size="44" font-weight="800" fill="#fff">5</text><text x="864" y="200" text-anchor="middle" font-size="19" font-weight="800" fill="#1d2040">Bản dịch cuối</text><text x="864" y="230" text-anchor="middle" font-size="14.5" fill="#55586b">Trình bày khớp</text><text x="864" y="252" text-anchor="middle" font-size="14.5" fill="#55586b">bản gốc</text><text x="480" y="305" text-anchor="middle" font-size="14" fill="#7f8491">Mức độ hậu biên tập (nhẹ hay đầy đủ) phụ thuộc mục đích sử dụng bản dịch</text></svg>