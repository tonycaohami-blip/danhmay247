<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" font-family="'Open Sans','Segoe UI',Arial,sans-serif"><rect width="960" height="400" rx="18" fill="#f6f7fb"/><rect x="50" y="40" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="80" cy="65" r="14" fill="#3bb54a"/><path d="M73 65 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="71" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">1. Đủ trang, đúng thứ tự</text><rect x="490" y="40" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="520" cy="65" r="14" fill="#3bb54a"/><path d="M513 65 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="71" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">2. Số liệu: tiền, ngày, số hiệu</text><rect x="50" y="104" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="80" cy="129" r="14" fill="#3bb54a"/><path d="M73 129 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="135" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">3. Tên riêng</text><rect x="490" y="104" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="520" cy="129" r="14" fill="#3bb54a"/><path d="M513 129 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="135" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">4. Chính tả, dấu tiếng Việt</text><rect x="50" y="168" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="80" cy="193" r="14" fill="#3bb54a"/><path d="M73 193 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="199" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">5. Chỗ đánh dấu [?]</text><rect x="490" y="168" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="520" cy="193" r="14" fill="#3bb54a"/><path d="M513 193 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="199" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">6. Định dạng, Heading</text><rect x="50" y="232" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="80" cy="257" r="14" fill="#3bb54a"/><path d="M73 257 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="263" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">7. Bảng biểu, tổng cộng</text><rect x="490" y="232" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="520" cy="257" r="14" fill="#3bb54a"/><path d="M513 257 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="263" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">8. Công thức sửa được</text><rect x="50" y="296" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="80" cy="321" r="14" fill="#3bb54a"/><path d="M73 321 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="106" y="327" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">9. Mục lục, số trang</text><rect x="490" y="296" width="420" height="50" rx="12" fill="#fff" stroke="#e3e5ef" stroke-width="2"/><circle cx="520" cy="321" r="14" fill="#3bb54a"/><path d="M513 321 l5 5 l9 -10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="546" y="327" text-anchor="start" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="700" font-size="17" fill="#1d2040">10. Mở được, xuất PDF</text><text x="480" y="380" text-anchor="middle" font-family="'Open Sans','Segoe UI',Arial,sans-serif" font-weight="400" font-size="14" fill="#7f8491">Kiểm tra ngay khi nhận file để còn thời gian yêu cầu chỉnh sửa miễn phí</text></svg>