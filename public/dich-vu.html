<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dịch vụ đánh máy &amp; chuyển đổi tài liệu — DanhMay247</title>
  <meta name="description" content="Tất cả dịch vụ: PDF sang Word, viết tay sang Word, ảnh sang Word, Word sang Excel, đánh máy LaTeX, công thức, văn bản pháp lý, định dạng, biên tập, chuyển âm.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;700&family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .svc-badge { display: inline-grid; place-items: center; width: 74px; height: 84px; border-radius: 10px; color: #fff; font: 800 18px var(--sans); box-shadow: 0 14px 30px rgba(0,0,0,.15); margin-bottom: 26px; }
    .svc-card { display: flex; flex-direction: column; gap: 14px; background: #fff; border-radius: 20px; box-shadow: var(--shadow); padding: 28px; transition: transform .25s, box-shadow .25s; height: 100%; }
    .svc-card:hover { transform: translateY(-5px); box-shadow: 0 18px 40px rgba(0,0,0,.1); }
    .svc-card .svc-badge { width: 52px; height: 60px; font-size: 13px; margin: 0; }
    .svc-card h3 { font: 400 20px/1.4 var(--serif); margin: 0; color: #000; }
    .svc-card p { font-size: 14.5px; line-height: 1.6; margin: 0; flex: 1; }
    .svc-card .from { font-weight: 700; color: var(--red); font-size: 15px; }
    .points { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .points li { display: flex; gap: 14px; align-items: flex-start; background: #fff; border-radius: 14px; box-shadow: var(--shadow-sm); padding: 20px; font-size: 15.5px; }
    .points li i { flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%; background: #e3f6e6; color: var(--green); display: grid; place-items: center; }
    .points li i svg { width: 14px; height: 14px; }
    .price-from { display: inline-flex; gap: 10px; align-items: baseline; background: #fff; border-radius: 40px; padding: 10px 22px; box-shadow: var(--shadow-sm); margin-top: 24px; }
    .price-from b { font: 700 22px var(--sans); color: #000; }
    @media (max-width: 640px) { .points { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-header="grey">
  <div id="site-header"></div>
  <main id="main"><div id="page"></div></main>
  <div id="site-footer"></div>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
  (function () {
    var $ = DM.$, slug = DM.param("slug"), page = $("#page");

    function priceFrom(s) {
      var p = DM.prices[s.service], t = p.types.find(function (x) { return x.key === s.type; }) || p.types[0];
      var min = Math.min.apply(null, Object.keys(p.base).map(function (k) { return p.base[k]; }));
      var extra = (s.extras || []).reduce(function (a, k) { var e = p.extras.find(function (x) { return x.key === k; }); return a + (e ? e.pct : 0); }, 0);
      return { value: Math.round(min * t.k * (1 + extra / 100) / 1000) * 1000, unit: p.unit };
    }
    function orderUrl(s) { return "/dat-hang?service=" + s.service + "&type=" + s.type + (s.extras ? "&extras=" + s.extras.join(",") : ""); }
    function badge(s) { return '<span class="svc-badge" style="background:' + s.icon[1] + '" aria-hidden="true">' + s.icon[0] + "</span>"; }
    function card(key) {
      var s = DM.services[key], pf = priceFrom(s);
      return '<a class="svc-card reveal" href="/dich-vu?slug=' + key + '">' + badge(s) + "<h3>" + s.title + "</h3><p>" + s.intro + '</p><span class="from">Từ ' + DM.fmt(pf.value) + "/" + pf.unit + "</span></a>";
    }

    var s = DM.services[slug];
    if (!s) {
      document.title = "Tất cả dịch vụ — DanhMay247";
      page.innerHTML =
        '<section class="page-hero"><div class="container"><nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Trang chủ</a><span>/</span><span aria-current="page">Dịch vụ</span></nav>' +
        "<h1>Tất cả dịch vụ</h1><p>Đánh máy lại, chuyển đổi định dạng, biên tập và chuyển âm — mọi công việc với tài liệu, do con người thực hiện.</p></div></section>" +
        '<section class="section"><div class="container"><h2 class="section-title">Đánh máy &amp; chuyển đổi</h2><div class="grid-3">' +
        Object.keys(DM.services).filter(function (k) { return DM.services[k].service === "retyping"; }).map(card).join("") + "</div></div></section>" +
        '<section class="section section--grey"><div class="container"><h2 class="section-title">Chuyển âm</h2><div class="grid-3">' +
        Object.keys(DM.services).filter(function (k) { return DM.services[k].service === "transcription"; }).map(card).join("") +
        '<a class="svc-card reveal" href="/dich-vu-chuyen-am"><span class="svc-badge" style="background:#3bb54a" aria-hidden="true">▶</span><h3>Chuyển âm video &amp; âm thanh</h3><p>Phỏng vấn, hội thảo, bài giảng, podcast, video YouTube… chuyển thành văn bản chính xác, có mốc thời gian.</p><span class="from">Từ ' + DM.fmt(DM.prices.transcription.base["10d"]) + "/phút</span></a>" +
        "</div></div></section>";
      return;
    }

    document.title = s.title + " — Dịch vụ đánh máy DanhMay247";
    var meta = document.querySelector('meta[name="description"]'); if (meta) meta.content = s.intro;
    var pf = priceFrom(s);
    var sample = DM.samples[s.type === "hand-excel" || s.type === "word-excel" ? 2 : s.type === "hand-word" ? 0 : 1];
    var related = Object.keys(DM.services).filter(function (k) { return k !== slug && DM.services[k].service === s.service; }).slice(0, 3);
    var faq = DM.faq.filter(function (f) { return ["Dịch vụ", "Đặt hàng"].indexOf(f.cat) > -1; }).slice(0, 5);

    page.innerHTML =
      '<section class="page-hero"><div class="container"><nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Trang chủ</a><span>/</span><a href="/dich-vu">Dịch vụ</a><span>/</span><span aria-current="page">' + s.title + "</span></nav>" +
      badge(s) + "<h1>" + s.title + "</h1><p>" + s.intro + "</p>" +
      '<div class="price-from"><span>Chỉ từ</span><b>' + DM.fmt(pf.value) + "</b><span>/ " + pf.unit + "</span></div><br>" +
      '<a class="button" href="' + orderUrl(s) + '">Đặt hàng ngay</a></div></section>' +

      '<section class="section"><div class="container"><h2 class="section-title reveal">Bạn nhận được gì?</h2><ul class="points">' +
      s.points.map(function (p) { return '<li class="reveal"><i>' + DM.icon.check + "</i><span>" + p + "</span></li>"; }).join("") +
      '<li class="reveal"><i>' + DM.icon.check + "</i><span>Chỉnh sửa miễn phí trong 14 ngày sau khi bàn giao</span></li>" +
      '<li class="reveal"><i>' + DM.icon.check + "</i><span>Giao nhanh từ 6 giờ, cam kết đúng hạn hoặc hoàn tiền</span></li></ul></div></section>" +

      (s.service === "retyping" ?
      '<section class="section section--navy"><div class="container grid-2"><div class="reveal"><h2 class="section-title section-title--left section-title--light">Trước &amp; sau</h2><p class="lead" style="color:var(--navy-light)">Kéo thanh trượt để xem tài liệu gốc được chúng tôi chuyển thành văn bản sạch đẹp, giữ đúng bố cục như thế nào.</p><a class="button" href="/mau">Xem thêm bài mẫu</a></div>' +
      '<div class="reveal" style="max-width:420px;width:100%;justify-self:center">' + DM.compare(sample) + "</div></div></section>" : "") +

      '<section class="howit-section"><div class="container"><div class="howit-section__text reveal"><h2 class="section-title howit-section__title">Quy trình 3 bước</h2><ul class="howit-list">' +
      '<li><div class="title">Đặt hàng &amp; tải tệp</div><p>Chọn dịch vụ, thời hạn, số lượng và tải tệp lên. Giá được tính ngay lập tức.</p></li>' +
      '<li><div class="title">Thanh toán an toàn</div><p>Quét mã VietQR bằng app ngân hàng, MoMo hoặc ZaloPay. Đơn hàng bắt đầu ngay khi thanh toán thành công.</p></li>' +
      '<li><div class="title">Nhận tài liệu</div><p>Nhận email thông báo và tải tài liệu từ tài khoản. Yêu cầu chỉnh sửa miễn phí nếu cần.</p></li></ul>' +
      '<a class="button" href="' + orderUrl(s) + '">Bắt đầu ngay</a></div>' +
      '<div class="faq-section__items reveal" data-accordion style="flex:1">' + faq.map(function (f, i) { return DM.faqItem(f, i === 0); }).join("") + "</div></div></section>" +

      '<section class="section section--grey"><div class="container"><h2 class="section-title">Dịch vụ liên quan</h2><div class="grid-3">' + related.map(card).join("") + "</div></div></section>";
    DM.initCompare(page);
  })();
  </script>
</body>
</html>
