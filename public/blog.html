<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog - Kiến thức đánh máy, chuyển âm &amp; số hóa tài liệu | Đánh máy 247</title>
  <meta name="description" content="Gõ 10 ngón, công thức Toán – Lý – Hóa, LaTeX, chuyển PDF sang Word, nhập liệu Excel, dịch thuật song ngữ, phụ đề SRT, trình bày văn bản theo Nghị định 30… Kiến thức hữu ích về đánh máy và tài liệu.">
  <meta property="og:title" content="Blog Đánh máy 247 - Kiến thức đánh máy & số hóa tài liệu">
  <meta property="og:image" content="https://danhmay247.com/assets/img/blog/go-10-ngon-30-ngay.svg">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-header="grey">
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero">
      <div class="container">
        <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Trang chủ</a><span>/</span><span aria-current="page">Blog</span></nav>
        <h1>Blog Đánh máy 247</h1>
        <p>Kỹ năng gõ phím, chính tả, trình bày văn bản và câu chuyện số hóa tài liệu - chia sẻ từ đội ngũ chuyên viên đánh máy và biên tập của chúng tôi.</p>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <div class="blog-toolbar">
          <div class="filter-pills" id="cats" role="group" aria-label="Chuyên mục"></div>
          <div class="search"><span id="search-ic"></span><label class="sr-only" for="q">Tìm bài viết</label><input class="input" id="q" type="search" placeholder="Tìm bài viết…"></div>
        </div>
        <div id="feature"></div>
        <div class="blog-grid" id="posts" aria-live="polite"></div>
        <div class="pagination" id="pages"></div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/posts.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
  (function () {
    var $ = DM.$, $$ = DM.$$, PER = 9, page = 1, cat = DM.param("cat") || "Tất cả", q = DM.param("q") || "";
    $("#search-ic").innerHTML = DM.icon.search;
    $("#q").value = q;
    var norm = function (s) { return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/g, "d"); };
    var vnDate = function (d) { return d.split("-").reverse().join("/"); };
    var meta = function (p) { return '<div class="post-meta"><span>' + DM.icon.clock + p.read + " phút đọc</span><span>" + vnDate(p.date) + "</span></div>"; };
    function card(p) {
      return '<a class="post-card" href="/blog/' + p.slug + '"><div class="post-card__img"><img src="' + p.cover + '" alt="" loading="lazy" width="1200" height="630"><span class="chip">' + DM.esc(p.cat) + "</span></div>" +
        '<div class="post-card__body"><h3>' + DM.esc(p.title) + "</h3><p>" + DM.esc(p.excerpt) + "</p>" + meta(p) + "</div></a>";
    }
    function feature(p) {
      return '<a class="post-feature" href="/blog/' + p.slug + '"><div class="post-feature__img"><img src="' + p.cover + '" alt="" width="1200" height="630"></div>' +
        '<div class="post-feature__body"><span class="chip chip--red" style="align-self:flex-start">Bài mới nhất · ' + DM.esc(p.cat) + "</span><h2>" + DM.esc(p.title) + "</h2><p>" + DM.esc(p.excerpt) + "</p>" + meta(p) +
        '<span class="link" style="align-self:flex-start">Đọc bài viết →</span></div></a>';
    }
    function draw() {
      var sorted = DM.posts.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
      var cats = ["Tất cả"].concat(sorted.map(function (p) { return p.cat; }).filter(function (c, i, a) { return a.indexOf(c) === i; }));
      $("#cats").innerHTML = cats.map(function (c) { return '<button type="button" class="' + (c === cat ? "is-active" : "") + '" aria-pressed="' + (c === cat) + '">' + DM.esc(c) + "</button>"; }).join("");
      $$("#cats button").forEach(function (b) { b.addEventListener("click", function () { cat = b.textContent; page = 1; draw(); }); });
      var list = sorted.filter(function (p) {
        return (cat === "Tất cả" || p.cat === cat) && (!q || norm(p.title + " " + p.excerpt + " " + p.tags.join(" ") + " " + p.body).indexOf(norm(q)) > -1);
      });
      // Bài nổi bật: chỉ hiện ở trang đầu, khi xem tất cả và không tìm kiếm
      var showFeature = cat === "Tất cả" && !q && page === 1 && list.length > 1;
      $("#feature").innerHTML = showFeature ? feature(list[0]) : "";
      var rest = showFeature ? list.slice(1) : list;
      var pages = Math.max(1, Math.ceil(rest.length/PER));
      page = Math.min(page, pages);
      $("#posts").innerHTML = rest.slice((page - 1) * PER, page * PER).map(card).join("") ||
        (showFeature ? "" : '<div class="empty" style="grid-column:1/-1">' + DM.icon.search + "<p>Không tìm thấy bài viết phù hợp" + (q ? " với “" + DM.esc(q) + "”" : "") + ".</p></div>");
      $("#pages").innerHTML = pages > 1 ? Array.from({ length: pages }, function (_, i) { return '<button type="button" class="' + (i + 1 === page ? "is-active" : "") + '" aria-label="Trang ' + (i + 1) + '">' + (i + 1) + "</button>"; }).join("") : "";
      $$("#pages button").forEach(function (b, i) { b.addEventListener("click", function () { page = i + 1; draw(); window.scrollTo({ top: $("#cats").getBoundingClientRect().top + window.scrollY - 100 }); }); });
    }
    var deb;
    $("#q").addEventListener("input", function () { clearTimeout(deb); var v = this.value; deb = setTimeout(function () { q = v.trim(); page = 1; draw(); }, 200); });
    draw();
  })();
  </script>
</body>
</html>
