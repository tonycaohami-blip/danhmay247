<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài viết — Đánh máy 247</title>
  <meta name="description" content="Bài viết từ blog Đánh máy 247.">
  <meta property="og:type" content="article">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-header="grey">
  <div id="site-header"></div>
  <div class="read-progress" id="progress" aria-hidden="true"></div>
  <main id="main"><div id="post"></div></main>
  <div id="site-footer"></div>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/posts.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
  (function () {
    var $ = DM.$, $$ = DM.$$, slug = DM.param("slug");
    var posts = DM.posts.slice().sort(function (a, b) { return b.date.localeCompare(a.date); });
    var idx = posts.findIndex(function (x) { return x.slug === slug; });
    var p = posts[idx];
    if (!p) {
      $("#post").innerHTML = '<section class="page-hero"><div class="container"><h1>Không tìm thấy bài viết</h1><p>Bài viết có thể đã được di chuyển hoặc không tồn tại.</p><a href="/blog" class="button">Về trang Blog</a></div></section>';
      return;
    }
    var vnDate = function (d) { return d.split("-").reverse().join("/"); };
    var url = location.origin + "/bai-viet?slug=" + p.slug;

    /* SEO: tiêu đề, mô tả, ảnh chia sẻ, dữ liệu có cấu trúc */
    document.title = p.title + " — Đánh máy 247";
    var setMeta = function (attr, key, val) {
      var m = document.querySelector("meta[" + attr + '="' + key + '"]');
      if (!m) { m = document.createElement("meta"); m.setAttribute(attr, key); document.head.appendChild(m); }
      m.setAttribute("content", val);
    };
    setMeta("name", "description", p.excerpt);
    setMeta("property", "og:title", p.title);
    setMeta("property", "og:description", p.excerpt);
    setMeta("property", "og:image", location.origin + p.cover);
    var canon = document.createElement("link"); canon.rel = "canonical"; canon.href = url; document.head.appendChild(canon);
    var ld = document.createElement("script"); ld.type = "application/ld+json";
    ld.textContent = JSON.stringify({ "@context": "https://schema.org", "@type": "BlogPosting", headline: p.title, description: p.excerpt, image: location.origin + p.cover,
      datePublished: p.date, author: { "@type": "Organization", name: "Đánh máy 247" }, publisher: { "@type": "Organization", name: "Đánh máy 247 - VietSCI Editing Services" }, mainEntityOfPage: url, keywords: p.tags.join(", ") });
    document.head.appendChild(ld);

    /* Bài liên quan: cùng chuyên mục trước, rồi cùng thẻ, rồi mới nhất */
    var score = function (x) { return (x.cat === p.cat ? 3 : 0) + x.tags.filter(function (t) { return p.tags.indexOf(t) > -1; }).length; };
    var related = posts.filter(function (x) { return x.slug !== p.slug; }).sort(function (a, b) { return score(b) - score(a) || b.date.localeCompare(a.date); }).slice(0, 3);
    var newer = posts[idx - 1], older = posts[idx + 1];
    var card = function (r) {
      return '<a class="post-card" href="/bai-viet?slug=' + r.slug + '"><div class="post-card__img"><img src="' + r.cover + '" alt="" loading="lazy" width="1200" height="630"><span class="chip">' + DM.esc(r.cat) + "</span></div>" +
        '<div class="post-card__body"><h3>' + DM.esc(r.title) + "</h3><p>" + DM.esc(r.excerpt) + '</p><div class="post-meta"><span>' + DM.icon.clock + r.read + " phút đọc</span><span>" + vnDate(r.date) + "</span></div></div></a>";
    };

    $("#post").innerHTML =
      '<section class="post-hero"><div class="container">' +
      '<nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Trang chủ</a><span>/</span><a href="/blog">Blog</a><span>/</span><a href="/blog?cat=' + encodeURIComponent(p.cat) + '">' + DM.esc(p.cat) + "</a></nav>" +
      "<h1>" + DM.esc(p.title) + '</h1><div class="post-meta" style="justify-content:center"><span>' + DM.esc(p.author) + "</span><span>" + vnDate(p.date) + "</span><span>" + DM.icon.clock + p.read + " phút đọc</span></div>" +
      '<div class="post-hero__cover"><img src="' + p.cover + '" alt="' + DM.esc(p.title) + '" width="1200" height="630"></div></div></section>' +
      '<section class="section" style="padding-top:50px"><div class="container"><div class="post-layout">' +
      '<article class="prose" id="article" style="max-width:none;margin:0">' + p.body +
      '<div class="post-tags">' + p.tags.map(function (t) { return "<span>#" + DM.esc(t) + "</span>"; }).join("") + "</div>" +
      '<div style="display:flex;gap:10px;align-items:center;margin-top:24px;flex-wrap:wrap"><b style="color:#000">Chia sẻ:</b>' +
      '<a class="button button--sm button--black" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url) + '">Facebook</a>' +
      '<a class="button button--sm button--black" style="text-decoration:none" target="_blank" rel="noopener" href="https://zalo.me/share?u=' + encodeURIComponent(url) + '">Zalo</a>' +
      '<button type="button" class="button button--sm button--black" id="copy">Sao chép liên kết</button></div>' +
      '<div class="post-author"><span class="login__avatar" aria-hidden="true">ĐM</span><div><b>' + DM.esc(p.author) + "</b><small>" + DM.esc(DM.site.tagline) + ". Chúng tôi chia sẻ kinh nghiệm thực tế từ công việc đánh máy, chuyển âm và biên tập tài liệu mỗi ngày.</small></div></div>" +
      '<nav class="post-nav" aria-label="Bài trước và bài sau">' +
      (older ? '<a href="/bai-viet?slug=' + older.slug + '"><small>← Bài trước</small><b>' + DM.esc(older.title) + "</b></a>" : "<span></span>") +
      (newer ? '<a class="next" href="/bai-viet?slug=' + newer.slug + '"><small>Bài tiếp theo →</small><b>' + DM.esc(newer.title) + "</b></a>" : "<span></span>") + "</nav>" +
      '<div class="routine-tasks" style="margin-top:44px"><div class="routine-tasks__title">Cần đánh máy tài liệu ngay?</div><p>Đặt hàng trong 3 phút, nhận kết quả chỉ từ 6 giờ. 100% do người thật gõ, bảo mật tuyệt đối.</p><a href="/dat-hang" class="button" style="text-decoration:none;color:#fff">Đặt hàng ngay</a></div>' +
      "</article>" +
      '<aside class="post-aside"><nav class="toc" id="toc" aria-label="Mục lục"></nav>' +
      '<div class="aside-cta"><b>Gõ lại tài liệu chỉ từ ' + DM.fmt(DM.prices.retyping.base["30d"]) + "/trang</b>PDF, ảnh chụp, chữ viết tay sang Word — giữ nguyên định dạng, có biên tập viên kiểm tra." +
      '<a href="/bang-gia" class="button">Xem bảng giá</a></div></aside>' +
      "</div></div></section>" +
      '<section class="section section--grey"><div class="container"><h2 class="section-title">Bài viết liên quan</h2><div class="blog-grid">' + related.map(card).join("") + "</div></div></section>";

    /* Mục lục tự động từ các tiêu đề h2 */
    var heads = $$("#article h2");
    heads.forEach(function (h, i) { h.id = "muc-" + (i + 1); });
    if (heads.length >= 2) {
      $("#toc").innerHTML = "<b>Nội dung bài viết</b><ol>" + heads.map(function (h) { return '<li><a href="#' + h.id + '">' + DM.esc(h.textContent) + "</a></li>"; }).join("") + "</ol>";
    } else $("#toc").remove();
    var links = $$("#toc a");

    /* Thanh tiến độ đọc + đánh dấu mục đang đọc */
    var art = $("#article"), bar = $("#progress");
    var onScroll = function () {
      var r = art.getBoundingClientRect(), total = art.offsetHeight - window.innerHeight;
      bar.style.width = Math.min(100, Math.max(0, (-r.top + 120) / Math.max(1, total) * 100)) + "%";
      var cur = -1;
      heads.forEach(function (h, i) { if (h.getBoundingClientRect().top < 160) cur = i; });
      links.forEach(function (a, i) { a.classList.toggle("is-active", i === cur); });
    };
    window.addEventListener("scroll", onScroll, { passive: true }); onScroll();

    $("#copy").addEventListener("click", function () {
      var done = function () { DM.toast("Đã sao chép liên kết bài viết."); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, function () { DM.toast("Không thể sao chép, hãy copy từ thanh địa chỉ.", "error"); });
      else DM.toast("Trình duyệt không hỗ trợ sao chép tự động.", "error");
    });
  })();
  </script>
</body>
</html>
