<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài viết — DanhMay247</title>
  <meta name="description" content="Bài viết từ blog DanhMay247.">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&family=Open+Sans:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-header="grey">
  <div id="site-header"></div>
  <main id="main"><div id="post"></div></main>
  <div id="site-footer"></div>
  <script src="/assets/js/data.js"></script>
  <script src="/assets/js/main.js"></script>
  <script>
  (function () {
    var $ = DM.$, slug = DM.param("slug");
    var p = DM.posts.find(function (x) { return x.slug === slug; });
    if (!p) {
      $("#post").innerHTML = '<section class="page-hero"><div class="container"><h1>Không tìm thấy bài viết</h1><p>Bài viết có thể đã được di chuyển hoặc không tồn tại.</p><a href="/blog" class="button">Về trang Blog</a></div></section>';
      return;
    }
    document.title = p.title + " — DanhMay247";
    var meta = document.querySelector('meta[name="description"]'); if (meta) meta.content = p.excerpt;
    var related = DM.posts.filter(function (x) { return x.slug !== p.slug; }).slice(0, 3);
    var card = function (r) {
      return '<a class="post-card" href="/bai-viet?slug=' + r.slug + '"><div class="post-card__cover" style="background:' + r.color + '"><span class="chip">' + r.cat + '</span><span aria-hidden="true">' + r.emoji + "</span></div>" +
        '<div class="post-card__body"><h3>' + r.title + "</h3><p>" + r.excerpt + '</p><div class="post-card__meta"><span>' + r.date.split("-").reverse().join("/") + "</span><span>" + r.read + " phút đọc</span></div></div></a>";
    };
    $("#post").innerHTML =
      '<section class="post-hero"><div class="container"><nav class="breadcrumbs" aria-label="Breadcrumb"><a href="/">Trang chủ</a><span>/</span><a href="/blog">Blog</a><span>/</span><span aria-current="page">' + p.cat + "</span></nav>" +
      "<h1>" + p.title + '</h1><div class="meta">' + p.date.split("-").reverse().join("/") + " · " + p.read + " phút đọc · " + p.cat + "</div></div></section>" +
      '<section class="section"><div class="container"><article class="prose">' + p.body +
      '<div class="routine-tasks" style="margin-top:50px"><div class="routine-tasks__title">Cần đánh máy tài liệu ngay?</div><p>Đặt hàng trong 3 phút, nhận kết quả chỉ từ 6 giờ.</p><a href="/dat-hang" class="button" style="text-decoration:none;color:#fff">Đặt hàng ngay</a></div>' +
      '<div style="display:flex;gap:10px;align-items:center;margin-top:30px;flex-wrap:wrap"><b style="color:#000">Chia sẻ:</b>' +
      '<a class="button button--sm button--black" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(location.href) + '">Facebook</a>' +
      '<button type="button" class="button button--sm button--black" id="copy">Sao chép liên kết</button></div>' +
      "</article></div></section>" +
      '<section class="section section--grey"><div class="container"><h2 class="section-title">Bài viết liên quan</h2><div class="blog-grid">' + related.map(card).join("") + "</div></div></section>";
    $("#copy").addEventListener("click", function () {
      var done = function () { DM.toast("Đã sao chép liên kết bài viết."); };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, function () { DM.toast("Không thể sao chép, hãy copy từ thanh địa chỉ.", "error"); });
      else DM.toast("Trình duyệt không hỗ trợ sao chép tự động.", "error");
    });
  })();
  </script>
</body>
</html>
